<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">MIF pipeline placeholder</title>
  <desc id="desc">A three-stage pipeline placeholder for the paper homepage.</desc>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="70" y="82" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">MIF Framework Pipeline</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="80" y="150" width="280" height="210" rx="28" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="120" y="230" fill="#1e3a8a" font-size="30" font-weight="700">Appearance Field</text>
    <text x="120" y="280" fill="#1e40af" font-size="21">Confidence-aware semantic 3DGS</text>
